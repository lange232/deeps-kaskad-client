name: release-apk

# Manual release of the arm64 standalone APK to GitHub Releases.
# The tag must match versionName in gradle/libs.versions.toml, so bump
# versionName (and versionCode) before running this.
#
# Each release carries two copies of the same APK:
#   deepskaskad-standalone-v<version>-arm64.apk  versioned, for pinning
#   deepskaskad.apk                             fixed name, for a stable URL
# Stable URL of the newest arm64 build:
#   https://github.com/lange232/deeps-kaskad-client/releases/latest/download/deepskaskad.apk
# The panel's scripts/fetch-apk.sh selects the asset by the *-arm64.apk
# suffix and fails when more than one matches, so exactly one such asset
# may be attached per release.
#
# Required repository secrets:
#   KEYSTORE               base64 of app/keystore/android_keystore.jks
#   SIGNING_KEY_ALIAS
#   SIGNING_KEY_PASSWORD
#   SIGNING_STORE_PASSWORD

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, empty means v<versionName> from libs.versions.toml"
        type: string
        required: false
        default: ""
      draft:
        description: "Create the release as a draft"
        type: boolean
        required: false
        default: false
      prerelease:
        description: "Mark the release as a prerelease"
        type: boolean
        required: false
        default: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Read versions and resolve tag
        id: versions
        run: |
          jdk=$(sed -nE 's/^jdk[[:space:]]*=[[:space:]]*"([0-9]+)".*/\1/p' gradle/libs.versions.toml)
          version_name=$(sed -nE 's/^versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' gradle/libs.versions.toml)
          version_code=$(sed -nE 's/^versionCode[[:space:]]*=[[:space:]]*"([0-9]+)".*/\1/p' gradle/libs.versions.toml)
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="v$version_name"
          fi
          if [ "$tag" != "v$version_name" ]; then
            echo "Tag '$tag' does not match versionName '$version_name' in gradle/libs.versions.toml." >&2
            echo "Bump versionName and versionCode first, or pass the matching tag." >&2
            exit 1
          fi
          echo "jdk=$jdk" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.versions.outputs.jdk }}
          cache: gradle

      - name: Restore keystore
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "The KEYSTORE secret is not set: it must hold base64 of app/keystore/android_keystore.jks" >&2
            exit 1
          fi
          keystore_dir="$GITHUB_WORKSPACE/app/keystore"
          keystore_file="$keystore_dir/android_keystore.jks"
          mkdir -p "$keystore_dir"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore_file"
          echo "KEY_STORE_PATH=$keystore_file" >> "$GITHUB_ENV"

      - name: Build standalone release
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleStandaloneRelease --no-daemon

      - name: Collect arm64 APK
        id: apk
        run: |
          out=app/build/outputs/apk/standalone/release
          apk=$(find "$out" -maxdepth 1 -type f -name '*-arm64.apk' | head -n 1)
          if [ -z "$apk" ]; then
            echo "No arm64 APK in $out" >&2
            ls -la "$out" || true
            exit 1
          fi
          mkdir -p dist
          cp "$apk" dist/
          # Fixed-name copy for releases/latest/download/deepskaskad.apk.
          # It has no -arm64 suffix on purpose: the panel pins the versioned
          # asset by that suffix and must find exactly one.
          cp "$apk" dist/deepskaskad.apk
          cmp -s "dist/$(basename "$apk")" dist/deepskaskad.apk
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
          echo "file=$(basename "$apk")" >> "$GITHUB_OUTPUT"

      - name: Assert a single arm64 asset
        run: |
          count=$(find dist -maxdepth 1 -type f -name '*-arm64.apk' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one *-arm64.apk asset, found $count" >&2
            ls -la dist
            exit 1
          fi

      - name: Verify signature
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apksigner >/dev/null
          apksigner verify --print-certs dist/*.apk > certs.txt
          cat certs.txt
          grep -oP '(?<=SHA-256 digest: ).*' certs.txt | head -n 1 > fingerprint.txt

      - name: Build release notes
        run: |
          version_name="${{ steps.versions.outputs.version_name }}"
          version_code="${{ steps.versions.outputs.version_code }}"
          changelog="fastlane/metadata/android/en-US/changelogs/${version_code}.txt"
          {
            echo "arm64 APK of deeps kaskad v${version_name} (versionCode ${version_code}), Android 8.0+."
            echo
            echo "Stable link to the newest arm64 build:"
            echo
            echo "https://github.com/lange232/deeps-kaskad-client/releases/latest/download/deepskaskad.apk"
            echo
            echo "The same file is attached as \`deepskaskad-standalone-v${version_name}-arm64.apk\` for pinning."
            echo
            if [ -f "$changelog" ]; then
              cat "$changelog"
            else
              echo "No changelog for versionCode ${version_code}."
            fi
            echo
            echo "### Checksums"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            echo "Signing certificate SHA-256 fingerprint:"
            echo
            echo '```'
            cat fingerprint.txt
            echo '```'
            echo
            echo "The APK is signed with the same key as the panel build, so it installs over an existing install."
          } > release-notes.md

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-apk-${{ steps.versions.outputs.tag }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error

      - name: Create GitHub release
        run: |
          tag="${{ steps.versions.outputs.tag }}"
          args=(--target "$GITHUB_SHA" --title "$tag" --notes-file release-notes.md)
          if [ "${{ inputs.draft }}" = "true" ]; then
            args+=(--draft)
          fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$tag" dist/*.apk dist/SHA256SUMS.txt "${args[@]}"
          # dist/*.apk attaches both the versioned arm64 APK and
          # deepskaskad.apk (stable URL); SHA256SUMS.txt lists both.
